<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burraco · Tavoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♣</text></svg>">
</head>
<body data-page="tavoli">
  <header id="site-header"></header>
  <main>
    <div class="page-title">
      <h2>Tavoli</h2>
      <p>Scegli la coppia e gli avversari per vedere gli scontri diretti.</p>
    </div>

    <div class="panel" data-suit="♣">
      <div class="versus">
        <div class="team-box team-a">
          <h4><span class="black">♠</span> Coppia</h4>
          <div class="field"><label>Giocatore 1</label><select class="sel" id="c1"></select></div>
          <div class="field"><label>Giocatore 2</label><select class="sel" id="c2"></select></div>
        </div>
        <div class="vs">VS</div>
        <div class="team-box team-b">
          <h4><span class="red">♥</span> Avversari</h4>
          <div class="field"><label>Giocatore 1</label><select class="sel" id="o1"></select></div>
          <div class="field"><label>Giocatore 2</label><select class="sel" id="o2"></select></div>
        </div>
      </div>
      <p class="hint" style="text-align:center">Puoi lasciare vuoti alcuni campi: per esempio scegli solo la coppia per vedere come se la cava contro tutti gli avversari.</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn ghost small" id="swap">⇄ Inverti</button>
        <button class="btn ghost small" id="clear">Svuota</button>
      </div>
    </div>

    <div id="result"></div>

    <div class="panel suit-red" data-suit="♦" id="popular-panel">
      <h3>Tavoli più giocati</h3>
      <div id="popular"></div>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script>
  (function () {
    const list = Store.all();
    const players = allPlayers(list);
    const ids = ['c1', 'c2', 'o1', 'o2'];

    if (!list.length) {
      $('main').innerHTML = `<div class="page-title"><h2>Tavoli</h2></div><div class="panel">${emptyState('Servono delle partite per confrontare i tavoli.')}</div>`;
      return;
    }

    ids.forEach(id => $('#' + id).innerHTML = `<option value="">— nessuno —</option>` + players.map(p => `<option value="${esc(norm(p))}">${esc(p)}</option>`).join(''));

    const sel = () => {
      const v = id => $('#' + id).value;
      return { c: [v('c1'), v('c2')].filter(Boolean), o: [v('o1'), v('o2')].filter(Boolean) };
    };
    const nameOf = k => players.find(p => norm(p) === k) || k;
    const has = (team, needed) => { const t = teamPlayers(team).map(norm); return needed.every(n => t.includes(n)); };

    function render() {
      const { c, o } = sel();
      // disabilita i giocatori già scelti negli altri campi
      ids.forEach(id => {
        const others = ids.filter(x => x !== id).map(x => $('#' + x).value).filter(Boolean);
        $$('option', $('#' + id)).forEach(op => op.disabled = op.value && others.includes(op.value));
      });
      // salva selezione nell'URL
      const qs = new URLSearchParams(); ids.forEach(id => $('#' + id).value && qs.set(id, $('#' + id).value));
      history.replaceState(null, '', qs.toString() ? '?' + qs : location.pathname);

      const out = $('#result');
      if (!c.length) { out.innerHTML = ''; return; }

      // partite dal punto di vista della "coppia"
      const sides = [];
      list.forEach(g => ['A', 'B'].forEach(s => {
        const me = s === 'A' ? g.a : g.b, them = s === 'A' ? g.b : g.a;
        if (has(me, c) && has(them, o)) sides.push(side(g, s));
      }));
      sides.sort((x, y) => (y.game.data || '').localeCompare(x.game.data || ''));

      const cName = c.length === 2 ? c.map(nameOf).join(' & ') : nameOf(c[0]) + (c.length === 1 ? ' (con chiunque)' : '');
      const oName = o.length === 2 ? o.map(nameOf).join(' & ') : o.length === 1 ? nameOf(o[0]) + ' (con chiunque)' : 'Tutti gli avversari';

      if (!sides.length) {
        out.innerHTML = `<div class="panel" data-suit="♠">${emptyState(`Nessuna partita tra <b>${esc(cName)}</b> e <b>${esc(oName)}</b>.`, false)}</div>`;
        return;
      }

      const A = newAgg(cName), B = newAgg(oName);
      sides.forEach(sd => {
        addToAgg(A, sd);
        const op = side(sd.game, sd.other); addToAgg(B, op);
      });
      [...sides].reverse().forEach((sd, i) => { A.forma[i] = sd.esito; B.forma[i] = side(sd.game, sd.other).esito; });
      finalizeAgg(A); finalizeAgg(B);

      const row = (label, a, b, f = fmt, higher = true) => {
        const ba = higher ? a > b : a < b, bb = higher ? b > a : b < a;
        return `<tr><td class="${ba ? 'best' : ''}">${f(a)}</td><td>${label}</td><td class="${bb ? 'best' : ''}">${f(b)}</td></tr>`;
      };

      // scomposizione per avversari (se non sono fissati entrambi)
      let breakdown = '';
      if (o.length < 2 || c.length < 2) {
        const m = new Map();
        sides.forEach(sd => {
          const k = (c.length < 2 ? teamKey(sd.players) + '>' : '') + teamKey(sd.opponents);
          const label = (c.length < 2 ? teamName(sd.players) + ' vs ' : '') + teamName(sd.opponents);
          if (!m.has(k)) m.set(k, newAgg(label));
          addToAgg(m.get(k), sd);
        });
        const rows = [...m.values()].map(finalizeAgg);
        breakdown = `<div class="panel" data-suit="♣"><h3>Dettaglio per tavolo</h3><div id="breakdown"></div></div>`;
        setTimeout(() => sortableTable($('#breakdown'), rows, [
          { key: 'label', label: 'Tavolo', render: r => `<b>${esc(r.label)}</b>` },
          { key: 'g', label: 'G', num: 1 }, { key: 'v', label: 'V', num: 1 }, { key: 'p', label: 'P', num: 1 },
          { key: 'winPct', label: '% Vitt.', num: 1, render: r => `${r.winPct}%<span class="meter"><span style="width:${r.winPct}%"></span></span>` },
          { key: 'media', label: 'Media punti', num: 1, render: r => fmt(r.media) },
          { key: 'diff', label: 'Diff. media', num: 1, render: r => `${r.diff >= 0 ? '+' : ''}${fmt(r.diff)}` },
          { key: 'forma', label: 'Ultime 5', sortable: false, render: r => formDots(r.forma) }
        ], 'g'));
      }

      out.innerHTML = `
        <div class="kpis">
          <div class="kpi"><span class="k-suit black">♠</span><div class="k-label">Partite giocate</div><div class="k-value">${A.g}</div><div class="k-sub">dal ${fmtDate(sides[sides.length - 1].game.data)} al ${fmtDate(sides[0].game.data)}</div></div>
          <div class="kpi"><span class="k-suit red">♥</span><div class="k-label">Bilancio</div><div class="k-value">${A.v}–${A.p}${A.n ? '–' + A.n : ''}</div><div class="k-sub">${A.v > A.p ? 'in vantaggio' : A.v < A.p ? 'in svantaggio' : 'in parità'} · ${A.winPct}% vittorie</div></div>
          <div class="kpi"><span class="k-suit black">♣</span><div class="k-label">Serie in corso</div><div class="k-value">${A.serie.replace('V', ' vitt.').replace('P', ' sconf.').replace('N', ' par.')}</div><div class="k-sub">${formDots(A.forma)}</div></div>
          <div class="kpi"><span class="k-suit red">♦</span><div class="k-label">Saldo punti</div><div class="k-value" style="color:${A.pf - A.ps >= 0 ? 'var(--win)' : 'var(--lose)'}">${A.pf - A.ps >= 0 ? '+' : ''}${fmt(A.pf - A.ps)}</div><div class="k-sub">${fmt(A.diff)} a partita</div></div>
        </div>

        <div class="panel" data-suit="♠">
          <h3>Testa a testa</h3>
          <div class="h2h-bar">
            <div class="a" style="width:${pct(A.v, A.g)}%">${A.v || ''}</div>
            <div class="x" style="width:${pct(A.n, A.g)}%">${A.n || ''}</div>
            <div class="b" style="width:${pct(B.v, A.g)}%">${B.v || ''}</div>
          </div>
          <div class="h2h-legend"><span><b class="black">♠ ${esc(cName)}</b></span><span><b class="red">${esc(oName)} ♥</b></span></div>
          <div class="table-wrap" style="margin-top:14px"><table class="compare">
            <thead><tr><th>${esc(cName)}</th><th></th><th>${esc(oName)}</th></tr></thead>
            <tbody>
              ${row('Vittorie', A.v, B.v)}
              ${row('% vittorie', A.winPct, B.winPct, x => x + '%')}
              ${row('Punti totali', A.pf, B.pf)}
              ${row('Media punti', A.media, B.media)}
              ${row('Punteggio record', A.max, B.max)}
              ${row('Burraci puliti', A.puliti, B.puliti)}
              ${row('Burraci sporchi', A.sporchi, B.sporchi)}
              ${row('Burraci a partita', A.burraci / A.g, B.burraci / B.g, fmt1)}
              ${row('Chiusure', A.chiusure, B.chiusure)}
            </tbody>
          </table></div>
        </div>
        ${breakdown}
        <div class="panel suit-red" data-suit="♦">
          <h3>Storico partite</h3>
          ${sides.map(sd => {
            const g = sd.game;
            return `<div class="match">
              <div class="m-date"><b>${fmtDate(g.data)}</b>${esc(g.luogo || '')}</div>
              <div class="m-team ${sd.esito === 'V' ? 'winner' : ''}">${esc(teamName(sd.players))}<small>${sd.puliti} puliti · ${sd.sporchi} sporchi</small></div>
              <div class="score">${fmt(sd.punti)} – ${fmt(sd.avv)}</div>
              <div class="m-team right ${sd.esito === 'P' ? 'winner' : ''}">${esc(teamName(sd.opponents))}</div>
              <div><span class="badge ${sd.esito}">${sd.esito === 'V' ? 'Vittoria' : sd.esito === 'P' ? 'Sconfitta' : 'Pareggio'}</span></div>
            </div>`;
          }).join('')}
        </div>`;
    }

    // tavoli più giocati
    const tables = new Map();
    list.forEach(g => {
      const ka = teamKey(g.a), kb = teamKey(g.b);
      const [k1, k2] = [ka, kb].sort();
      const k = k1 + ' vs ' + k2;
      if (!tables.has(k)) tables.set(k, { a: k1.split('|'), b: k2.split('|'), g: 0 });
      tables.get(k).g++;
    });
    const top = [...tables.values()].sort((x, y) => y.g - x.g).slice(0, 8);
    $('#popular').innerHTML = `<div class="btn-row" style="padding-left:14px">${top.map((t, i) =>
      `<button class="btn ghost small" data-t="${i}">${esc(t.a.map(nameOf).join(' & '))} <span class="red">vs</span> ${esc(t.b.map(nameOf).join(' & '))} · ${t.g}</button>`).join('')}</div>`;
    $('#popular').onclick = e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      const t = top[b.dataset.t];
      $('#c1').value = t.a[0] || ''; $('#c2').value = t.a[1] || '';
      $('#o1').value = t.b[0] || ''; $('#o2').value = t.b[1] || '';
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    ids.forEach(id => $('#' + id).addEventListener('change', render));
    $('#swap').onclick = () => {
      const v = ids.map(id => $('#' + id).value);
      $('#c1').value = v[2]; $('#c2').value = v[3]; $('#o1').value = v[0]; $('#o2').value = v[1];
      render();
    };
    $('#clear').onclick = () => { ids.forEach(id => $('#' + id).value = ''); render(); };

    // ripristina dall'URL
    const qs = new URLSearchParams(location.search);
    ids.forEach(id => { if (qs.get(id)) $('#' + id).value = qs.get(id); });
    render();
  })();
  </script>
</body>
</html>
